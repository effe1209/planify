name: Test dell'interfaccia

on:
  push:
    branches: [main, new_features]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: floorplan-app/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Motore Python
        run: pip install -r requirements.txt
      - name: Dipendenze dell'app
        working-directory: floorplan-app
        run: npm ci
      - name: Browser
        working-directory: floorplan-app
        run: npx playwright install --with-deps chromium
      - name: Test dell'interfaccia
        working-directory: floorplan-app
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: floorplan-app/test-results }
